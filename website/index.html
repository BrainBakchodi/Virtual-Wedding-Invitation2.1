<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Wedding Invitation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500&family=Galada&family=Noto+Serif+Bengali:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ===================== THEME ===================== */
        :root {
            --ivory: #fcf6ea;
            --cream: #f4e7cc;
            --gold: #b08d4c;
            --gold-light: #dcc080;
            --red: #7d1f2a;
            --red-deep: #561019;
            --ink: #3b2a22;
            --muted: #7a6657;
        }
        /* Language-specific typography */
        html[lang="en"] {
            --deco: 'Great Vibes', cursive;
            --serif: 'Cormorant Garamond', Georgia, serif;
            --sans: 'Montserrat', system-ui, sans-serif;
            --lh: 1.6; --base: 18px;
            --title-size: 2.8rem; --name-size: clamp(3.4rem, 15vw, 5.6rem);
            --cap-size: .68rem; --sub-size: 1.15rem;
        }
        html[lang="bn"] {
            --deco: 'Galada', 'Noto Serif Bengali', cursive;
            --serif: 'Noto Serif Bengali', 'Hind Siliguri', serif;
            --sans: 'Hind Siliguri', 'Noto Serif Bengali', sans-serif;
            --lh: 1.9; --base: 16px;
            --title-size: 2.5rem; --name-size: clamp(2.8rem, 13vw, 4.6rem);
            --cap-size: 1rem; --sub-size: 1.1rem;
        }
        /* Uppercase + letter-spacing only for English (they break Bengali conjuncts) */
        html[lang="en"] .caps { text-transform: uppercase; letter-spacing: .3em; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; font-size: var(--base); }

        body {
            font-family: var(--serif); color: var(--ink); line-height: var(--lh); overflow-x: hidden;
            background:
                    radial-gradient(circle at 15% 0%, rgba(220,192,128,.22), transparent 45%),
                    radial-gradient(circle at 85% 100%, rgba(125,31,42,.07), transparent 45%),
                    var(--ivory);
        }
        body.locked { overflow: hidden; height: 100vh; }   /* no scrolling until the invitation is opened */

        section {
            min-height: 100vh; padding: 84px 24px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; position: relative;
        }
        section:nth-of-type(even) { background: linear-gradient(180deg, var(--cream), var(--ivory)); }
        section::before { content:""; position:absolute; inset:14px; border:1px solid var(--gold-light); pointer-events:none; opacity:.8; }
        section::after  { content:""; position:absolute; inset:20px; border:1px solid rgba(176,141,76,.28); pointer-events:none; }

        .eyebrow { font-family: var(--sans); font-size: var(--cap-size); color: var(--gold); font-weight: 500; margin-bottom: 12px; }
        h2.title { font-family: var(--deco); font-size: var(--title-size); color: var(--red); font-weight: 400; line-height: 1.45; }
        .divider { display:flex; align-items:center; justify-content:center; gap:12px; margin: 10px auto 26px; color: var(--gold); }
        .divider::before, .divider::after { content:""; width:70px; height:1px; background: linear-gradient(90deg, transparent, var(--gold)); }
        .divider::after { transform: scaleX(-1); }

        /* ===================== SPLASH (tap to open + start music) ===================== */
        .splash {
            position: fixed; inset: 0; z-index: 200;
            background: radial-gradient(circle at 50% 30%, var(--red), var(--red-deep));
            color: var(--ivory); text-align: center; padding: 24px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity .9s ease, visibility .9s;
        }
        .splash::before { content:""; position:absolute; inset:14px; border:1px solid rgba(220,192,128,.6); pointer-events:none; }
        .splash::after  { content:""; position:absolute; inset:20px; border:1px solid rgba(220,192,128,.25); pointer-events:none; }
        .splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
        .splash .lang-switch { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 22px); left: 50%; transform: translateX(-50%); }
        .s-inv   { font-family: var(--deco); color: var(--gold-light); font-size: 1.5rem; }
        .s-names { font-family: var(--deco); color: #fff; font-size: var(--name-size); line-height: 1.35; margin: 14px 0 34px; white-space: pre-line; }
        .s-btn {
            font-family: var(--sans); font-size: var(--cap-size); font-weight: 500; cursor: pointer;
            color: var(--red-deep); background: var(--gold-light); border: 0; border-radius: 999px; padding: 15px 34px;
            box-shadow: 0 8px 24px rgba(0,0,0,.3); animation: glow 2.4s ease-in-out infinite;
        }
        html[lang="bn"] .s-btn { font-size: 1.15rem; }
        .s-note { margin-top: 16px; font-family: var(--sans); font-size: .85rem; color: rgba(252,246,234,.7); }
        @keyframes glow { 0%,100% { box-shadow: 0 8px 24px rgba(0,0,0,.3), 0 0 0 0 rgba(220,192,128,.55); } 50% { box-shadow: 0 8px 24px rgba(0,0,0,.3), 0 0 0 14px rgba(220,192,128,0); } }

        /* ===================== TOP BAR (language + music) ===================== */
        .topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 14px;
            background: linear-gradient(180deg, rgba(252,246,234,.92), rgba(252,246,234,0));
            pointer-events: none;
        }
        .topbar > * { pointer-events: auto; }
        .lang-switch { display: inline-flex; border: 1px solid var(--gold); border-radius: 999px; overflow: hidden; background: rgba(255,255,255,.92); box-shadow: 0 4px 14px rgba(0,0,0,.12); }
        .lang-switch button {
            border: 0; background: transparent; cursor: pointer; font-family: var(--sans); font-size: .9rem; font-weight: 500;
            color: var(--red); padding: 7px 16px; transition: all .25s;
        }
        .lang-switch button.active { background: var(--red); color: var(--ivory); }
        .music-btn {
            width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--gold); background: rgba(255,255,255,.92);
            color: var(--red); display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,.12);
        }
        .music-btn svg { width: 22px; height: 22px; fill: currentColor; stroke: currentColor; }
        .music-btn .ico-on { display: none; }
        .music-btn.on .ico-on { display: block; }
        .music-btn.on .ico-off { display: none; }
        .music-btn.on { animation: pulse 2.4s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(176,141,76,.5); } 50% { box-shadow: 0 0 0 9px rgba(176,141,76,0); } }

        .toast {
            position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); z-index: 300;
            background: rgba(59,42,34,.94); color: #fff; font-family: var(--sans); font-size: .9rem;
            padding: 10px 18px; border-radius: 999px; opacity: 0; pointer-events: none; transition: all .35s; max-width: 90vw; text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ===================== PHOTO SPACES ===================== */
        .photo {
            width: min(78vw, 320px); aspect-ratio: 3/4; margin: 0 auto 30px;
            border-radius: 160px 160px 12px 12px;
            border: 3px solid var(--gold-light); outline: 1px solid var(--gold); outline-offset: 7px;
            background: linear-gradient(135deg, rgba(220,192,128,.28), rgba(125,31,42,.08)), var(--cream);
            display:flex; align-items:center; justify-content:center; overflow:hidden;
            color: var(--gold); font-family: var(--sans); font-size: .9rem;
        }
        .photo.wide { aspect-ratio: 16/10; border-radius: 14px; width: min(86vw, 520px); }
        .photo img { width:100%; height:100%; object-fit:cover; display:block; }

        /* ===================== 1. HERO ===================== */
        #hero { background: transparent !important; padding-top: 96px; }
        .invocation { font-family: var(--deco); font-size: 1.35rem; color: var(--gold); margin-bottom: 8px; }
        .hero-names { font-family: var(--name-font); color: var(--red); line-height: 1.4; }
        html[lang="en"] { --name-font: 'Allura'; }
        html[lang="bn"] { --name-font: 'Tiro Bangla', serif; }
        .hero-names .n { font-size: var(--name-size); display: block; }
        .hero-names .and { font-family: var(--serif); font-style: italic; font-size: 1.5rem; color: var(--gold); display: block; }
        .tagline { margin-top: 16px; font-style: italic; color: var(--muted); font-size: var(--sub-size); }
        .scroll-hint { position:absolute; bottom:34px; font-family: var(--sans); font-size: .8rem; color: var(--gold); animation: bob 2s ease-in-out infinite; }
        @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(8px)} }

        /* ===================== 2. EVENTS ===================== */
        .events { display: grid; gap: 28px; width: 100%; max-width: 440px; margin-top: 6px; }
        .event-card {
            background: rgba(255,255,255,.72); border: 1px solid var(--gold-light);
            padding: 34px 24px 26px; position: relative;
            box-shadow: 0 14px 40px rgba(125,31,42,.10);
        }
        .ev-icon {
            position: absolute; top: -24px; left: 50%; transform: translateX(-50%);
            width: 48px; height: 48px; border-radius: 50%; background: var(--red);
            border: 2px solid var(--gold-light); display:flex; align-items:center; justify-content:center; font-size: 1.4rem;
        }
        .ev-name { font-family: var(--deco); font-size: 2.1rem; color: var(--red); font-weight: 400; line-height: 1.5; margin-top: 6px; }
        .ev-date { display:flex; justify-content:center; align-items:center; gap: 14px; margin: 6px 0 2px; }
        .ev-num { font-size: 3.6rem; line-height: 1.2; color: var(--red); font-weight: 600; }
        .ev-my { text-align: left; font-family: var(--sans); font-size: .95rem; color: var(--muted); line-height: 1.5; }
        .ev-when { color: var(--gold); font-size: 1.15rem; font-weight: 500; }
        .ev-venue { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--gold-light); }
        .ev-venue b { display:block; color: var(--red); font-size: 1.15rem; font-weight: 600; }
        .ev-venue span { color: var(--muted); font-size: .95rem; }
        .ev-map { display:inline-block; margin-top: 12px; font-family: var(--sans); font-size: .85rem; color: var(--red); text-decoration: none; border-bottom: 1px solid var(--gold); padding-bottom: 1px; }
        @media (min-width: 900px) { .events { grid-template-columns: repeat(3, 1fr); max-width: 1020px; } }

        /* ===================== 2b. INVITATION MESSAGE ===================== */
        .photo.round { border-radius: 50%; aspect-ratio: 1; width: min(52vw, 200px); margin-bottom: 26px; }
        .invite-card {
            max-width: 520px; width: 100%; padding: 40px 26px 34px; position: relative;
            background: rgba(255,255,255,.62); border: 1px solid var(--gold-light);
            box-shadow: 0 14px 40px rgba(125,31,42,.10);
        }
        .invite-card::before, .invite-card::after {
            content: "❦"; position: absolute; left: 50%; transform: translateX(-50%);
            color: var(--gold); font-size: 1.6rem; background: var(--ivory); padding: 0 12px; line-height: 1;
        }
        .invite-card::before { top: -14px; }
        .invite-card::after  { bottom: -14px; }
        .inv-greeting { font-family: var(--deco); font-size: 2.1rem; color: var(--red); line-height: 1.5; margin-bottom: 14px; }
        .inv-line { font-size: 1.25rem; color: var(--ink); margin: 14px 0; }
        html[lang="en"] .inv-line { font-style: italic; font-size: 1.4rem; }
        .inv-closing { margin-top: 24px; font-family: var(--deco); font-size: 1.9rem; color: var(--gold); line-height: 1.5; }

        /* ===================== 3. COUNTDOWN ===================== */
        #countdown-sec { background: linear-gradient(180deg, var(--red-deep), var(--red)) !important; color: var(--ivory); }
        #countdown-sec::before { border-color: rgba(220,192,128,.6); }
        #countdown-sec::after  { border-color: rgba(220,192,128,.25); }
        #countdown-sec h2.title, #countdown-sec .eyebrow, #countdown-sec .divider { color: var(--gold-light); }
        .count-grid { display:grid; grid-template-columns: repeat(2,1fr); gap:16px; margin-top: 20px; width:100%; max-width: 340px; }
        .count-box { border:1px solid rgba(220,192,128,.65); padding: 20px 8px; background: rgba(255,255,255,.06); }
        .count-box .v { font-size: 2.9rem; line-height: 1.3; color:#fff; font-weight: 600; }
        .count-box .l { font-family: var(--sans); font-size: var(--cap-size); color: var(--gold-light); }
        #count-msg { display:none; margin-top: 24px; font-family: var(--deco); font-size: 2.2rem; color: var(--gold-light); }
        @media (min-width: 700px) { .count-grid { grid-template-columns: repeat(4,1fr); max-width: 640px; } }

        /* ===================== 4. FAMILIES ===================== */
        .family-wrap { display:grid; gap: 34px; width:100%; max-width: 520px; }
        .family h3 {  font-family: var(--name-font),serif; color: var(--red); font-weight: 400; line-height: 1.45; font-size: 2.2rem; }
        .family .role { font-family: var(--sans),serif; font-size: var(--cap-size); color: var(--gold); margin-bottom: 6px; font-weight: 500; }
        .family .person { font-size: 1.15rem; margin-top: 12px; }
        .family .person:first-of-type { margin-top: 0; }
        .family .person b { color: var(--red); font-weight: 600; }
        .family .person small { display:block; color: var(--muted); font-style: italic; font-size: .95rem; }
        .heart { color: var(--gold); font-size: 1.5rem; }
        @media (min-width: 700px) { .family-wrap { grid-template-columns: 1fr auto 1fr; max-width: 860px; align-items: center; } }

        /* ===================== 5. MAP ===================== */
        .map-frame { width:min(88vw,520px); height:260px; border:3px solid var(--gold-light); outline:1px solid var(--gold); outline-offset:6px; margin: 10px auto 32px; overflow:hidden; background: var(--cream); }
        .map-frame iframe { width:100%; height:100%; border:0; filter: sepia(.25) saturate(.9); }
        .btn {
            display:inline-block; text-decoration:none; cursor:pointer; font-family: var(--sans); font-size: var(--cap-size); font-weight:500;
            color: var(--ivory); background: var(--red); padding: 15px 32px; border:1px solid var(--red); transition: all .3s;
        }
        .btn:active, .btn:hover { background: transparent; color: var(--red); }
        html[lang="bn"] .btn { font-size: 1.1rem; }

        /* ===================== 6. RSVP ===================== */
        .rsvp-sub { max-width: 420px; color: var(--muted); font-size: var(--sub-size); margin-bottom: 22px; }
        .rsvp-card {
            width: 100%; max-width: 440px; text-align: left; background: rgba(255,255,255,.75);
            border: 1px solid var(--gold-light); padding: 28px 22px; box-shadow: 0 14px 40px rgba(125,31,42,.10);
        }
        .field { margin-bottom: 20px; }
        .field > label, .field .lbl { display:block; font-family: var(--sans); font-size: .9rem; font-weight: 500; color: var(--red); margin-bottom: 6px; }
        .field input[type="text"], .field textarea {
            width: 100%; font-family: var(--serif); font-size: 1.1rem; color: var(--ink);
            border: 1px solid var(--gold-light); background: #fffdf8; padding: 11px 14px; outline: none; border-radius: 4px;
        }
        .field input:focus, .field textarea:focus { border-color: var(--red); }
        .field textarea { resize: none; height: 78px; }
        .choice { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .choice label { position: relative; }
        .choice input { position:absolute; opacity:0; inset:0; cursor:pointer; }
        .choice span {
            display:block; text-align:center; padding: 12px 8px; border: 1px solid var(--gold); border-radius: 999px;
            font-family: var(--sans); font-size: .95rem; color: var(--red); transition: all .25s;
        }
        .choice input:checked + span { background: var(--red); color: var(--ivory); border-color: var(--red); }
        .stepper { display:inline-flex; align-items:center; border: 1px solid var(--gold-light); border-radius: 999px; background:#fffdf8; }
        .stepper button { width: 44px; height: 44px; border:0; background:transparent; font-size: 1.5rem; color: var(--red); cursor:pointer; }
        .stepper output { min-width: 52px; text-align:center; font-size: 1.4rem; font-weight: 600; color: var(--ink); }
        .field.hidden { display: none; }
        .rsvp-error { color: #b3261e; font-family: var(--sans); font-size: .9rem; margin-bottom: 12px; min-height: 1.2em; }
        .rsvp-card .btn { width: 100%; text-align:center; border-radius: 999px; display:flex; align-items:center; justify-content:center; gap: 10px; }
        .rsvp-card .btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* ===================== 7. QUOTE ===================== */
        .quote { max-width: 480px; font-size: 1.55rem; font-style: italic; color: var(--ink); line-height: 1.9; }
        html[lang="bn"] .quote { font-style: normal; font-size: 1.4rem; }
        .quote-mark { font-family: var(--deco); font-size: 5rem; color: var(--gold-light); line-height: .6; display:block; }
        .signoff { margin-top: 26px; font-family: var(--deco); font-size: 2.5rem; color: var(--red); line-height: 1.5; }
        .with-love { font-family: var(--sans); font-size: var(--cap-size); color: var(--gold); margin-top: 6px; }

        /* ===================== REVEAL ===================== */
        .reveal { opacity:0; transform: translateY(34px); transition: opacity 1s ease, transform 1s ease; }
        .reveal.show { opacity:1; transform:none; }
        .d1{transition-delay:.15s} .d2{transition-delay:.3s} .d3{transition-delay:.45s}
    </style>
</head>

<body class="locked">

<!-- ============ SPLASH: tap to open the invitation (this tap also starts the song) ============ -->
<div class="splash" id="splash">
    <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="bn">বাংলা</button>
        <button type="button" data-lang="en">English</button>
    </div>
    <p class="s-inv" data-i18n="invocation"></p>
    <p class="s-names" id="splashNames"></p>
    <button type="button" class="s-btn caps" id="openBtn" data-i18n="open_btn"></button>
    <p class="s-note" data-i18n="open_note"></p>
</div>

<!-- ============ TOP BAR: language switch + music ============ -->
<div class="topbar">
    <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="bn">বাংলা</button>
        <button type="button" data-lang="en">English</button>
    </div>
    <button type="button" class="music-btn" id="musicBtn" aria-label="Music on / off">
        <svg class="ico-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="ico-off" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z" stroke="none"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
</div>
<div class="toast" id="toast"></div>

<!-- Background song: put your file at music/song.mp3 (next to this index.html) -->
<audio id="bgm" loop preload="auto"></audio>

<!-- ============ 1. NAMES ============ -->
<section id="hero">
    <p class="invocation reveal" data-i18n="invocation"></p>
    <p class="eyebrow caps reveal" data-i18n="hero_eyebrow"></p>

    <!-- PHOTO SPACE: couple -->
    <div class="photo reveal d1" id="photo-couple"><span data-i18n="ph_couple"></span></div>

    <div class="hero-names reveal d2">
        <span class="n" id="groomName"></span>
        <span class="and" data-i18n="and"></span>
        <span class="n" id="brideName"></span>
    </div>
    <p class="tagline reveal d3" data-i18n="tagline"></p>
    <div class="scroll-hint caps"><span data-i18n="scroll"></span> ↓</div>
</section>

<!-- ============ 2. EVENTS ============ -->
<section id="events">
    <p class="eyebrow caps reveal" data-i18n="ev_eyebrow"></p>
    <h2 class="title reveal d1" data-i18n="ev_title"></h2>
    <div class="divider reveal d1">❖</div>

    <div class="events" id="eventsList"></div>

</section>

<!-- ============ 2b. INVITATION MESSAGE ============ -->
<section id="invite">
    <!-- PHOTO SPACE: round photo (couple, parents, or anything you like) -->


    <p class="eyebrow caps reveal d1" data-i18n="inv_eyebrow"></p>
    <h2 class="title reveal d1" data-i18n="inv_title"></h2>
    <div class="divider reveal d2">❖</div>

    <div class="invite-card reveal d2" id="inviteCard"></div>
</section>

<!-- ============ 3. COUNTDOWN ============ -->
<section id="countdown-sec">
    <p class="eyebrow caps reveal" data-i18n="cd_eyebrow"></p>
    <h2 class="title reveal d1" data-i18n="cd_title"></h2>
    <div class="divider reveal d1">❖</div>

    <div class="count-grid reveal d2" id="countGrid">
        <div class="count-box"><div class="v" id="cd-days">00</div><div class="l caps" data-i18n="cd_days"></div></div>
        <div class="count-box"><div class="v" id="cd-hours">00</div><div class="l caps" data-i18n="cd_hours"></div></div>
        <div class="count-box"><div class="v" id="cd-mins">00</div><div class="l caps" data-i18n="cd_mins"></div></div>
        <div class="count-box"><div class="v" id="cd-secs">00</div><div class="l caps" data-i18n="cd_secs"></div></div>
    </div>
    <div id="count-msg" data-i18n="cd_done"></div>
</section>

<!-- ============ 4. FAMILY ============ -->
<section id="family">
    <p class="eyebrow caps reveal" data-i18n="fam_eyebrow"></p>
    <h2 class="title reveal d1" data-i18n="fam_title"></h2>
    <div class="divider reveal d1">❖</div>

    <!-- PHOTO SPACE: family -->

    <div class="family-wrap" id="familyWrap"></div>
</section>

<!-- ============ 5. MAP ============ -->

    /* ==================================================================

    const $ = id => document.getElementById(id);

    const T = k => I18N[lang][k] ?? "";
    const L = o => (o && (o[lang] ?? o.en)) || "";

    const BN_DIGITS = "০১২৩৪৫৬৭৮৯";
    const toBn  = v => String(v).replace(/\d/g, d => BN_DIGITS[d]);
    const num   = v => lang === "bn" ? toBn(v) : String(v);
    const pad2  = n => String(n).padStart(2, "0");

    const MONTHS_BN = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
    const DAYS_BN   = ["রবিবার","সোমবার","মঙ্গলবার","বুধবার","বৃহস্পতিবার","শুক্রবার","শনিবার"];
    const MONTHS_EN = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const DAYS_EN   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

    function periodBn(h) {
        if (h >= 4  && h < 6)  return "ভোর";
        if (h >= 6  && h < 12) return "সকাল";
        if (h >= 12 && h < 15) return "দুপুর";
        if (h >= 15 && h < 17) return "বিকেল";
        if (h >= 17 && h < 19) return "সন্ধ্যা";
        return "রাত";
    }
    function fmt(d) {
        const h24 = d.getHours(), m = d.getMinutes(), h12 = h24 % 12 || 12;
        if (lang === "bn") {
            return { num: toBn(d.getDate()), month: MONTHS_BN[d.getMonth()], year: toBn(d.getFullYear()),
                weekday: DAYS_BN[d.getDay()], time: periodBn(h24) + " " + toBn(h12) + ":" + toBn(pad2(m)) + " টায়" };
        }
        return { num: String(d.getDate()), month: MONTHS_EN[d.getMonth()], year: String(d.getFullYear()),
            weekday: DAYS_EN[d.getDay()], time: h12 + ":" + pad2(m) + " " + (h24 < 12 ? "AM" : "PM") };
    }
    const mapUrl = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);

    let toastTimer;
    function toast(msg) {
        const t = $("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
    }

    /* ==================================================================
       RENDER (re-run whenever the language changes)
       ================================================================== */
    let revealed = false;   // after first paint, re-rendered blocks appear instantly

    function renderEvents() {
        $("eventsList").innerHTML = CONFIG.events.map((ev, i) => {
            const f = fmt(new Date(ev.date));
            return `
    <article class="event-card reveal ${revealed ? "show" : ""}" style="transition-delay:${i * 0.15}s">
      <div class="ev-icon">${ev.icon}</div>
      <h3 class="ev-name">${T("ev_" + ev.key)}</h3>
      <div class="ev-date"><span class="ev-num">${f.num}</span><span class="ev-my">${f.month}<br>${f.year}</span></div>
      <div class="ev-when">${f.weekday} · ${f.time}</div>
      <div class="ev-venue"><b>${L(ev.venue)}</b><span>${L(ev.address)}</span></div>
      <a class="ev-map" href="${mapUrl(ev.mapQuery)}" target="_blank" rel="noopener">${T("map_short")} ↗</a>
    </article>`;
        }).join("");
    }

    function renderInvite() {
        const inv = CONFIG.invite;
        const lines = (inv.lines[lang] || inv.lines.en).map(t => `<p class="inv-line">${t}</p>`).join("");

    }

    function renderFamily() {
        const side = (who) => {

            return `
    <div class="family reveal ${revealed ? "show" : ""}">
      <div class="role caps">${T(g ? "fam_groom_side" : "fam_bride_side")}</div>

      <div class="person"><small>${T(g ? "gp_groom" : "gp_bride")}</small>${L(f.grandparents)}</div>
      <div class="person"><small>${T("siblings")}</small>${L(f.siblings)}</div>
    </div>`;
        };
        $("familyWrap").innerHTML = side("groom") + `<div class="heart">♥</div>` + side("bride");
    }

    function applyLang(l) {
        lang = l;
        try { localStorage.setItem("wedLang", l); } catch (e) {}
        document.documentElement.lang = l;

        document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = T(el.dataset.i18n));
        document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = T(el.dataset.i18nPh));
        document.querySelectorAll(".lang-switch button").forEach(b => b.classList.toggle("active", b.dataset.lang === l));

        $("groomName").textContent = $("signGroom").textContent = L(CONFIG.groom);
        $("brideName").textContent = $("signBride").textContent = L(CONFIG.bride);
        $("splashNames").textContent = L(CONFIG.groom) + "\n" + T("and") + "\n" + L(CONFIG.bride);
        document.title = L(CONFIG.groom) + " " + T("and") + " " + L(CONFIG.bride);

        renderEvents();
        renderInvite();
        renderFamily();
        $("guestVal").textContent = num(guests);
        tick();
        observeReveals();
    }

    /* ==================================================================

       ================================================================== */
    const photoIds = { couple: "photo-couple", invite: "photo-invite", family: "photo-family", end: "photo-end" };
    Object.entries(photoIds).forEach(([key, id]) => {
        const src = CONFIG.photos[key];

        const el = $(id), img = new Image();
        img.alt = key;
        img.onload = () => { el.innerHTML = ""; el.appendChild(img); };   // only replaces the placeholder if the file exists
        img.src = src;
    });

    /* ==================================================================
       GOOGLE MAP (big map + button)
       ================================================================== */
    const mapEv = CONFIG.events.find(e => e.key === CONFIG.mapEvent) || CONFIG.events[0];
    $("mapFrame").src = "https://maps.google.com/maps?q=" + encodeURIComponent(mapEv.mapQuery) + "&z=15&output=embed";
    $("mapBtn").href  = mapUrl(mapEv.mapQuery);

    /* ==================================================================
       COUNTDOWN
       ================================================================== */
    const cdEv = CONFIG.events.find(e => e.key === CONFIG.countdownEvent) || CONFIG.events[0];
    const target = new Date(cdEv.date);
    function tick() {
        const diff = target - new Date();
        if (diff <= 0) {
            $("countGrid").style.display = "none";
            $("count-msg").style.display = "block";
            clearInterval(timer);
            return;
        }
        const s = Math.floor(diff / 1000);
        const p = n => lang === "bn" ? toBn(pad2(n)) : pad2(n);
        $("cd-days").textContent  = p(Math.floor(s / 86400));
        $("cd-hours").textContent = p(Math.floor((s % 86400) / 3600));
        $("cd-mins").textContent  = p(Math.floor((s % 3600) / 60));
        $("cd-secs").textContent  = p(s % 60);
    }
    const timer = setInterval(tick, 1000);

    /* ==================================================================
       RSVP -> WhatsApp
       ================================================================== */
    let guests = 1;
    const MAX_GUESTS = 10;
    const attendVal = () => document.querySelector('input[name="attend"]:checked').value;

    function syncAttend() { $("guestField").classList.toggle("hidden", attendVal() === "no"); }
    document.querySelectorAll('input[name="attend"]').forEach(r => r.addEventListener("change", syncAttend));
    $("gMinus").addEventListener("click", () => { guests = Math.max(1, guests - 1); $("guestVal").textContent = num(guests); });
    $("gPlus").addEventListener("click",  () => { guests = Math.min(MAX_GUESTS, guests + 1); $("guestVal").textContent = num(guests); });

    function buildMessage(name, attending, note) {
        const couple = L(CONFIG.groom) + " " + T("and") + " " + L(CONFIG.bride);
        let m;
        if (lang === "bn") {
            m = "নমস্কার! আমি " + name + "।\n";
            m += attending
                ? "আপনাদের (" + couple + ") শুভ বিবাহে আমি আনন্দের সাথে উপস্থিত থাকব। ✅\nমোট অতিথি: " + toBn(guests) + " জন"
                : "দুঃখিত, আপনাদের (" + couple + ") শুভ বিবাহে আমি উপস্থিত থাকতে পারছি না। 🙏";
            if (note) m += "\nবার্তা: " + note;
        } else {
            m = "Hello! This is " + name + ".\n";
            m += attending
                ? "I will be joyfully attending the wedding of " + couple + ". ✅\nTotal guests: " + guests
                : "I'm sorry, I won't be able to attend the wedding of " + couple + ". 🙏";
            if (note) m += "\nMessage: " + note;
        }
        return m;
    }

    $("rsvpForm").addEventListener("submit", e => {
        e.preventDefault();
        const name = $("rsvpName").value.trim();
        if (!name) { $("rsvpError").textContent = T("rsvp_err"); $("rsvpName").focus(); return; }
        $("rsvpError").textContent = "";
        const text = buildMessage(name, attendVal() === "yes", $("rsvpMsg").value.trim());
        window.location.href = "https://wa.me/" + CONFIG.whatsappNumber + "?text=" + encodeURIComponent(text);
    });

    /* ==================================================================
       MUSIC  (starts when the guest taps "Open Invitation"; button mutes / unmutes)
       ================================================================== */
    const bgm = $("bgm"), musicBtn = $("musicBtn");
    let musicMissing = false;

    bgm.addEventListener("error", () => { musicMissing = true; });   // file not found / unsupported
    bgm.src = CONFIG.music;
    bgm.volume = 0.6;

    const syncMusicBtn = () => musicBtn.classList.toggle("on", !bgm.paused && !bgm.muted);
    ["play", "pause", "volumechange"].forEach(ev => bgm.addEventListener(ev, syncMusicBtn));

    // Mute / unmute button (also starts the song if it hasn't started yet)
    musicBtn.addEventListener("click", () => {
        if (musicMissing) { toast(T("music_missing")); return; }
        if (bgm.paused) { bgm.muted = false; bgm.play().catch(() => {}); }
        else { bgm.muted = !bgm.muted; }
    });

    // Splash "Open Invitation": this tap is the user action browsers require for sound
    $("openBtn").addEventListener("click", () => {
        bgm.muted = false;
        bgm.play().catch(() => {});
        $("splash").classList.add("hide");
        document.body.classList.remove("locked");
        // replay the hero entrance animation now that it is visible
        document.querySelectorAll("#hero .reveal").forEach(el => {
            el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
        });
        if (musicMissing) toast(T("music_missing"));
    });

    // In the Android app autoplay is allowed, so this may already start the song behind the splash
    const auto = bgm.play();
    if (auto && auto.catch) auto.catch(() => {});

    // Pause when the page / app is in the background, resume when back
    let wasPlaying = false;
    document.addEventListener("visibilitychange", () => {
        if (document.hidden) { wasPlaying = !bgm.paused; bgm.pause(); }
        else if (wasPlaying) { bgm.play().catch(() => {}); }
    });

    /* ==================================================================
       LANGUAGE SWITCH + SCROLL REVEAL
       ================================================================== */
    document.querySelectorAll(".lang-switch button").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.lang)));

    const io = new IntersectionObserver(entries => {
        entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add("show"); io.unobserve(en.target); } });
    }, { threshold: 0.15 });
    function observeReveals() { document.querySelectorAll(".reveal:not(.show)").forEach(el => io.observe(el)); }

    syncAttend();
    applyLang(lang);
    revealed = true;   // anything re-rendered from now on shows instantly
</script>
</body>
</html>
